name: integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Pull image buat test
        run: docker pull alpine:3.20

      - name: Integration test (Docker asli)
        run: go test -tags=integration -v -timeout 5m ./internal/docker/...
